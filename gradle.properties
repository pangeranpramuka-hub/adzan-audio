# Modernized gradle.properties for June 2026
org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options\="-Xmx2048M" -XX\:MaxMetaspaceSize\=1024m -XX\:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=true

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
systemProp.com.android.sdk.analytics.disable=true
android.enableProfileJson=false


# Experimental / Optimized build flags
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.incremental.multiplatform=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
# org.gradle.tooling.parallel=true
org.gradle.configuration-cache=false

android.uniquePackageNames=false
android.dependency.useConstraints=true
kapt.use.worker.api=true
kapt.incremental.apt=true

android.suppressUnsupportedCompileSdk=36

# Mengaktifkan Resource Shrinker yang Dioptimalkan (R8)
android.experimental.enableNewResourceShrinker=true
android.enableR8.fullMode=true
